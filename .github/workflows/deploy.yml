name: Deploy Wiki
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material \
                      mkdocs-file-filter-plugin \
                      mkdocs-obsidian-bridge \
                      obsidian-media \
                      pyyaml

      - name: Copy public notes to docs/
        run: |
          python3 << 'EOF'
          import os
          import shutil
          import yaml
          import glob
          
          docs_dir = "docs"
          os.makedirs(docs_dir, exist_ok=True)
          
          for root, dirs, files in os.walk('.'):
            if any(x in root for x in ['.obsidian', 'templates', '.git', '.github', docs_dir]):
              continue
            
            for file in files:
              if file.endswith('.md'):
                filepath = os.path.join(root, file)
                with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
                  is_public = False
                  if content.startswith('---'):
                    parts = content.split('---', 2)
                    if len(parts) >= 2:
                      try:
                        frontmatter = yaml.safe_load(parts[1])
                        if frontmatter and 'published' in frontmatter.get('tags', []):
                          is_public = True
                      except:
                        pass
                  
                  if is_public:
                    rel_path = os.path.relpath(filepath)
                    dest_path = os.path.join(docs_dir, rel_path)
                    os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                    shutil.copy2(filepath, dest_path)
                    
                    file_dir = os.path.dirname(filepath)
                    base_name = os.path.splitext(file)[0]
                    for ext in ['.png', '.jpg', '.jpeg', '.gif', '.svg']:
                      img_path = os.path.join(file_dir, base_name + ext)
                      if os.path.exists(img_path):
                        img_dest_dir = os.path.dirname(dest_path)
                        os.makedirs(img_dest_dir, exist_ok=True)
                        shutil.copy2(img_path, os.path.join(img_dest_dir, os.path.basename(img_path)))
          
          for ext in ['.png', '.jpg', '.jpeg', '.gif', '.svg']:
            for img_file in glob.glob(f'*{ext}'):
              dest_img = os.path.join(docs_dir, img_file)
              if not os.path.exists(dest_img):
                shutil.copy2(img_file, dest_img)
          
          print("Public notes copied to docs/")
          EOF

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and Deploy
        run: mkdocs gh-deploy --force