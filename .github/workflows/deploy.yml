name: Deploy Wiki
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material \
                      mkdocs-publish-filter \
                      mkdocs-ezlinks-plugin \
                      mkdocs-callouts

      - name: Deploy
        run: mkdocs gh-deploy --force
