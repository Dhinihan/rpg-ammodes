name: Deploy Wiki
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install mkdocs-material \
                      mkdocs-ezlinks-plugin \
                      mkdocs-callouts \
                      beautifulsoup4 \
                      pyyaml

      - name: Filter public notes
        run: |
          python3 << 'EOF'
          import os
          import shutil
          import yaml
          
          temp_dir = "_temp_private"
          os.makedirs(temp_dir, exist_ok=True)
          
          for root, dirs, files in os.walk('.'):
            if any(x in root for x in ['.obsidian', 'templates', '.git', '.github', temp_dir]):
              continue
            
            for file in files:
              if file.endswith('.md'):
                filepath = os.path.join(root, file)
                with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
                  if content.startswith('---'):
                    parts = content.split('---', 2)
                    if len(parts) >= 2:
                      try:
                        frontmatter = yaml.safe_load(parts[1])
                        if not (frontmatter and frontmatter.get('publico') == True):
                          shutil.move(filepath, os.path.join(temp_dir, os.path.basename(filepath)))
                      except:
                        pass
          
          print("Private notes moved to temp folder")
          EOF

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build Check
        run: mkdocs build

      - name: Restore private notes
        run: |
          python3 << 'EOF'
          import os
          import shutil
          temp_dir = "_temp_private"
          for file in os.listdir(temp_dir):
            shutil.move(os.path.join(temp_dir, file), ".")
          os.rmdir(temp_dir)
          print("Private notes restored")
          EOF

      - name: Deploy
        run: mkdocs gh-deploy --force