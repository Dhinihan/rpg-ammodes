site_name: Ammódes Wiki
theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
    - scheme: default
      primary: teal
      accent: cyan
  features:
    - navigation.sections
    - search.suggest
    - search.highlight

plugins:
  - search
  - roamlinks:
      link_relative: true
  - callouts

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true